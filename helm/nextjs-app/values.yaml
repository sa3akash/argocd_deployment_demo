# Default values for nextjs-app.

replicaCount: 1

image:
  # Replace with your GitHub Container Registry or Docker Hub image path
  # Example: ghcr.io/your-github-username/your-repo-name
  repository: ghcr.io/sa3akash/argocd_deployment_demo
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "63aaa74"

# Image pull secret if the GitHub container package is private
imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: my.sa3avro.eu.cc
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # Uncomment if you have created the app-tls secret in Kubernetes:
    # - secretName: app-tls
    #   hosts:
    #     - my.sa3avro.eu.cc

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Environment variables
env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"

# Secret and ConfigMap environment references (never commit actual secrets to GitHub)
envFrom:
  - secretRef:
      name: nextjs-secrets
      optional: true

# In-cluster PostgreSQL deployment
# If enabled=true, Helm deploys PostgreSQL, runs initContainer to wait until healthy, and auto-syncs Drizzle DB
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  auth:
    database: blogdb
    username: postgres
    password: "StrongBlogPassword2026!"
    # Reference an existing Kubernetes secret if created on cluster (e.g. postgres-secret)
    existingSecret: ""
    secretKeys:
      adminPasswordKey: "postgres-password"

# Wait for PostgreSQL to be healthy before starting Next.js
waitForPostgres:
  enabled: true
  host: ""
  port: 5432

livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2
