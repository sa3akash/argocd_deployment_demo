# Production Environment Overrides
replicaCount: 2

image:
  # Updated automatically by GitHub Actions CI/CD on main branch push
  repository: ghcr.io/placeholder/code
  pullPolicy: IfNotPresent
  tag: "latest"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: app-production-tls
    #   hosts:
    #     - app.example.com

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"
