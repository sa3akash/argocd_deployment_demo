# Testing Environment Overrides
replicaCount: 1

image:
  # Updated automatically by GitHub Actions CI/CD
  repository: ghcr.io/sa3akash/argocd_deployment_demo
  pullPolicy: Always
  tag: "latest"

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

autoscaling:
  enabled: false

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: test.sa3avro.eu.cc
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  - name: NODE_ENV
    value: "test"
  - name: PORT
    value: "3000"
